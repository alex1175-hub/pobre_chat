<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Modo Oscuro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="row w-100 justify-content-center">
            <div class="col-md-6 col-lg-4">
                
                <!-- Tarjeta de Login -->
                <div class="card shadow-lg border-secondary bg-dark p-4">
                    
                    <!-- Logo centrado -->
                    <div class="text-center mb-4">
                        <img src="IMG/logo.png" alt="logo" class="img-fluid" style="height: 160px; width: auto; filter: brightness(1.1);">
                    </div>

                    <h2 class="text-center mb-4 fw-bold text-info">Login</h2>

                    <form id="loginForm">
                        <!-- Usuario -->
                        <div class="mb-3">
                            <label class="form-label">Ingrese su nombre de usuario</label>
                            <input type="text" name="user_name" class="form-control bg-dark border-secondary text-light" required>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-4">
                            <label class="form-label">Ingrese su contraseña</label>
                            <input type="password" name="user_pass" class="form-control bg-dark border-secondary text-light" required>
                        </div>

                        <!-- Botón Iniciar Sesión -->
                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-info shadow-sm fw-bold">Iniciar sesión</button>
                        </div>
                    </form>

                    <!-- Link de Registro -->
                    <div class="text-center">
                        <a href="registro.html" class="text-decoration-none text-info small">
                            ¿No tienes cuenta? Crea una cuenta aquí
                        </a>
                    </div>

                </div> <!-- Fin de la tarjeta -->

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/sanitizar.js"></script>
    <script src="JS/login.js"></script>
</body>
</html>

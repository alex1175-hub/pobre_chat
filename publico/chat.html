<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Modo Oscuro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-7">
                
                <!-- Tarjeta Principal del Chat -->
                <div class="card shadow-lg border-secondary bg-dark">
                    
                    <!-- Encabezado con Logo -->
                    <div class="card-header bg-dark py-4 d-flex justify-content-between align-items-center border-secondary">
                        <img src="IMG/logo.png" alt="logo" class="img-fluid" style="height: 160px; width: auto; filter: brightness(1.1);">
                        <div class="btn-group">
                            <a href="perfil.html" class="btn btn-outline-info rounded-pill me-2">
                                Modificar perfil
                            </a>
                            <button id="logout" class="btn btn-outline-danger rounded-pill">
                                Cerrar sesión
                            </button>
                        </div>
                    </div>

                    <!-- Cuerpo del Chat -->
                    <div class="card-body bg-black bg-opacity-25 overflow-auto" id="chat" style="height: 500px;">
                        <!-- Los mensajes con estilo oscuro irán aquí -->
                        <div class="text-center text-secondary small mt-5">
                            Conexión cifrada establecida
                        </div>
                    </div>

                    <!-- Pie de página con el Formulario -->
                    <div class="card-footer bg-dark border-secondary p-3">
                        <form class="input-group input-group-lg">
                            <input id="mensaje" type="text" class="form-control bg-dark border-secondary text-light shadow-sm" placeholder="Escribe un mensaje..." aria-label="Mensaje">
                            <button id="enviar" class="btn btn-info px-5 shadow" type="submit">
                                Enviar
                            </button>
                        </form>
                    </div>

                </div> <!-- Fin de la tarjeta -->

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/logout.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="JS/sanitizar.js"></script>
    <script src="JS/chat.js"></script>
</body>
</html>

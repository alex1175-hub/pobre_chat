<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Modo Oscuro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-md-8 col-lg-5">
                
                <!-- Tarjeta de Registro -->
                <div class="card shadow-lg border-secondary bg-dark p-4">
                    
                    <!-- Encabezado con Logo y Botón Volver -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <img src="IMG/logo.png" alt="logo" class="img-fluid" style="height: 100px; width: auto; filter: brightness(1.1);">
                        <a href="index.html">
                            <button id="perfil" class="btn btn-outline-info btn-sm rounded-pill px-3">Iniciar sesión</button>
                        </a>
                    </div>

                    <h2 class="text-center mb-4 fw-bold text-info">Crear Cuenta</h2>

                    <form action="/registro" method="POST">
                        <!-- Usuario -->
                        <div class="mb-3">
                            <label class="form-label">Ingrese su nombre de usuario</label>
                            <input type="text" name="user_name" class="form-control bg-dark border-secondary text-light" required>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label class="form-label">Ingrese su contraseña</label>
                            <input type="password" name="user_pass" class="form-control bg-dark border-secondary text-light" required>
                        </div>

                        <!-- Confirmar Contraseña -->
                        <div class="mb-3">
                            <label class="form-label">Confirme su contraseña</label>
                            <input type="password" name="confirm_pass" class="form-control bg-dark border-secondary text-light" required>
                        </div>

                        <!-- Color de Usuario -->
                        <div class="mb-4">
                            <label class="form-label d-block">Elige un color para tu nombre:</label>
                            <input type="color" name="color" class="form-control form-control-color bg-dark border-secondary w-100" value="#ff0000" style="height: 45px;">
                        </div>

                        <!-- Botón Registrarse -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-info shadow-sm fw-bold">Registrarse</button> 
                        </div>
                    </form>

                </div> <!-- Fin de la tarjeta -->

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/sanitizar.js"></script>
    <script src="JS/registro.js"></script>
</body>
</html>
